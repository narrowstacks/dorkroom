name: Homepage Screenshot

on:
  push:
    branches: [main]
    paths:
      - apps/dorkroom/src/app/pages/home-page.tsx
      - apps/dorkroom/src/routes/index.tsx
      # Only rendered UI source affects the screenshot — not package.json bumps,
      # config, docs, or tests under packages/ui (those triggered needless runs).
      - packages/ui/src/**
      - '!packages/ui/src/**/__tests__/**'
      - '!packages/ui/src/**/*.test.*'
      - scripts/screenshot-homepage.ts
      - .github/workflows/homepage-screenshot.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: homepage-screenshot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build app
        run: bun run build

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Capture homepage screenshot
        run: |
          # Serve the build and capture in the same step so the background
          # server's lifetime is scoped to this shell.
          #
          # We can't assume :4300 — the @vercel/microfrontends Vite plugin's
          # config() hook overrides preview.port with a value derived from the
          # package name (e.g. :4503), which wins over the port in vite.config.ts.
          # So we read the actual bound port from the server's own startup output
          # ("➜  Local:   http://localhost:<port>/") instead of hardcoding it.
          log="$(mktemp)"
          # NO_COLOR keeps Vite from wrapping the port digits in ANSI escapes
          # (it prints "localhost:\e[1m4503\e[22m/"); we also strip any escapes
          # below so parsing is robust regardless.
          (cd apps/dorkroom && NO_COLOR=1 bunx vite preview) >"$log" 2>&1 &
          server_pid=$!

          port=""
          for _ in $(seq 1 60); do
            port="$(sed -E 's/\x1b\[[0-9;]*m//g' "$log" | grep -oiE 'localhost:[0-9]+' | head -1 | grep -oE '[0-9]+' || true)"
            [ -n "$port" ] && curl -sf "http://localhost:${port}/" >/dev/null && break
            # Stop waiting if the server process has exited.
            kill -0 "$server_pid" 2>/dev/null || break
            sleep 1
          done

          if [ -z "$port" ] || ! curl -sf "http://localhost:${port}/" >/dev/null; then
            echo "Preview server did not start; captured output:"
            cat "$log"
            exit 1
          fi
          echo "Preview server ready on :${port}"

          SCREENSHOT_URL="http://localhost:${port}/" bun run scripts/screenshot-homepage.ts

      - name: Commit updated screenshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain resources/dorkroom-homepage.webp)" ]; then
            echo "Screenshot unchanged; nothing to commit."
            exit 0
          fi
          git add resources/dorkroom-homepage.webp
          git commit -m "chore: update homepage screenshot [skip ci]"
          # Other push-triggered workflows (e.g. the README badge sync) can land
          # on main first, rejecting our push. The screenshot commit only touches
          # one binary file, so a rebase is conflict-free — retry a few times.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Pushed on attempt ${attempt}."
              exit 0
            fi
            echo "Push rejected (attempt ${attempt}); rebasing onto latest main..."
            git pull --rebase origin main
          done
          echo "Failed to push screenshot after 5 attempts." >&2
          exit 1
