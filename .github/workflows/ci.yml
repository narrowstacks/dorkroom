name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  actions: read
  contents: read

jobs:
  build-and-test:
    runs-on: namespace-profile-lx
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Setup Node.js (required for Vite 7 ESM support)
      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      # Setup bun
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Namespace cache volume: a persistent local disk, no keys or network
      # transfer. Install always runs and reconciles node_modules against the
      # lockfile (near no-op when the volume is warm).
      - name: Mount Namespace caches
        uses: namespacelabs/nscloud-cache-action@v1
        with:
          path: |
            ~/.bun/install/cache
            node_modules
            .turbo

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Turbo remote cache co-located with the Namespace runner. Exports
      # TURBO_TOKEN/TURBO_TEAM/TURBO_API into the job env, so it runs after
      # `bun install` to keep cache credentials out of the environment while
      # package lifecycle scripts execute.
      - name: Setup Turbo remote cache
        uses: namespace-actions/setup-turbocache@v0

      - name: Run quality checks (lint, test, build, typecheck)
        run: bun run test
