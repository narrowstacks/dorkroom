[install]
# Refuse to install npm package versions published less than 7 days ago.
# Mitigates supply-chain attacks that rely on freshly-published malicious
# versions being pulled in before anyone notices. See:
# https://bun.sh/docs/runtime/bunfig#install-minimumreleaseage
minimumReleaseAge = 604800 # 7 days, in seconds
# No exemptions. `typescript-7` and `typescript` were listed here only while the
# former tracked the moving `rc` dist-tag, which could resolve to a same-day
# pre-release. Both now sit on released versions that clear the gate on their
# own, so it applies to the whole dependency tree with no holes.
